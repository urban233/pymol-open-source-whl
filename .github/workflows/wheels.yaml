name: Build Wheels

on:
  pull_request:
    branches: [production]
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  VCPKG_ROOT: ${{ github.workspace }}/vendor/vcpkg
  VCPKG_COMMIT: 9942fb5f996ea431c5ed8fb8d2a53f31d08df62e

jobs:
  # ----- Windows build section
  build-windows:
    name: Windows (${{ matrix.win_arch }})
    env:
      WIN_ARCH: ${{ matrix.win_arch }}
    strategy:
      fail-fast: false
      matrix:
        win_arch: ['x86', 'x64']
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Initialize vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git vendor/vcpkg
          git -C vendor/vcpkg checkout ${{ env.VCPKG_COMMIT }}

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: vendor/vcpkg/downloads
          key: vcpkg-downloads-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ env.VCPKG_COMMIT }}-

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-${{ matrix.win_arch }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-${{ matrix.win_arch }}-${{ env.VCPKG_COMMIT }}-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Python environment
        run: uv sync --locked --no-install-project
        shell: cmd

      - name: Bootstrap vcpkg
        run: ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.bat -disableMetrics

      - name: Last build environment setup steps
        run: uv run --locked --no-sync python pymakefile.py setup_dev_env
        shell: cmd

      - name: Build and test x86 wheels
        if: ${{ matrix.win_arch == 'x86' }}
        run: |
          ${{ env.VCPKG_ROOT }}/vcpkg install --triplet=x86-windows-static
          set WIN_ARCH=x86
          uv run --locked --no-sync python pymakefile.py build_wheels platform=windows archs=x86
        shell: cmd

      - name: Build and test x64 wheels
        if: ${{ matrix.win_arch == 'x64' }}
        run: |
          ${{ env.VCPKG_ROOT }}/vcpkg install --triplet=x64-windows-static
          set WIN_ARCH=x64
          uv run --locked --no-sync python pymakefile.py build_wheels platform=windows archs=AMD64
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMOL-wheel-Windows-${{ matrix.win_arch }}
          path: ./wheelhouse/*.whl
  # --- end

  # ----- macOS build section
  build-macos:
    name: macOS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15-intel, macos-15 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Initialize vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git vendor/vcpkg
          git -C vendor/vcpkg checkout ${{ env.VCPKG_COMMIT }}

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: vendor/vcpkg/downloads
          key: vcpkg-downloads-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ env.VCPKG_COMMIT }}-

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-installed-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-${{ matrix.os }}-${{ env.VCPKG_COMMIT }}-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Python environment
        run: uv sync --locked --no-install-project

      - name: Bootstrap vcpkg
        run: ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh -disableMetrics

      - name: Install vcpkg dependencies
        run: |
          ${{ env.VCPKG_ROOT }}/vcpkg install

      - name: Last build environment setup steps
        run: ARCH=$(uname -m) uv run --locked --no-sync python pymakefile.py setup_dev_env

      - name: Build and test wheels
        run: |
          export ARCH=$(uname -m)
          export MACOSX_DEPLOYMENT_TARGET=12.0
          uv run --locked --no-sync python pymakefile.py build_wheels

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMOL-wheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl
  # --- end

  # ----- GNU Linux build section
  build-gnu-linux:
    name: GNU/Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install git build-essential libxmu-dev libxi-dev libgl-dev libglew-dev libpng-dev libfreetype6-dev libxml2-dev libmsgpack-dev libglm-dev libnetcdf-dev linux-libc-dev autoconf perl

      - name: Initialize vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git vendor/vcpkg
          git -C vendor/vcpkg checkout ${{ env.VCPKG_COMMIT }}

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: vendor/vcpkg/downloads
          key: vcpkg-downloads-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ env.VCPKG_COMMIT }}-

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-x64-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-installed-${{ runner.os }}-x64-${{ env.VCPKG_COMMIT }}-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Python environment
        run: uv sync --locked --no-install-project

      - name: Bootstrap vcpkg
        run: ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.sh -disableMetrics

      - name: Install vcpkg dependencies
        run: |
          ${{ env.VCPKG_ROOT }}/vcpkg install

      - name: Last build environment setup steps
        run: uv run --locked --no-sync python pymakefile.py setup_dev_env

      - name: Build and test wheels
        run: uv run --locked --no-sync python pymakefile.py build_wheels

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyMOL-wheel-GNU-Linux
          path: ./wheelhouse/*.whl
  # --- end

  release-integrity:
    name: Validate release distributions
    needs: [build-windows, build-macos, build-gnu-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PyMOL-wheel-*
          path: dist
          merge-multiple: true

      - name: Install distribution validation tools
        run: python -m pip install --disable-pip-version-check twine

      - name: Validate distribution metadata
        run: python -m twine check dist/*.whl

      - name: Verify release metadata and wheel coverage
        run: python scripts/verify_release.py --dist dist

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/verify_release.py --dist dist --tag "$GITHUB_REF_NAME"

      - name: Upload validated distributions
        uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*.whl
          if-no-files-found: error

  attest:
    name: Attest release distributions
    needs: release-integrity
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl

  publish:
    name: Publish distributions to PyPI
    needs: attest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pymol-open-source-whl
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
